plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'jacoco'
    id 'checkstyle'
    id 'me.champeau.jmh' version '0.7.2'
}

group = 'com.lemadane'
version = '0.2.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

application {
    mainClass = 'com.lemadane.jax.cli.JaxCli'
}

jar {
    archiveBaseName = 'jax'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jmh {
    warmupIterations = 3
    iterations = 5
    fork = 1
    timeOnIteration = '1s'
    resultFormat = 'JSON'
}

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    inputs.dir(layout.projectDirectory.dir('examples')).withPropertyName('generatedExamples')
    systemProperty 'jax.examples.path', layout.projectDirectory.dir('examples').asFile.absolutePath
    systemProperty 'jax.jar.path', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.97
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

checkstyle {
    toolVersion = '10.14.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = false
}

configurations.matching { it.name.startsWith('checkstyle') }.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('com.google.collections', 'google-collections') {
        select('com.google.guava:guava:0')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.lemadane'
            artifactId = 'jax'
            version = '0.2.0-SNAPSHOT'

            pom {
                name = 'jax'
                description = 'Java XML and JSON Record Mapping Library'
                url = 'https://github.com/lemadane/jax'
                licenses {
                    license {
                        name = 'The MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'lemadane'
                        name = 'lemadane Team'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/lemadane/jax.git'
                    developerConnection = 'scm:git:ssh://github.com/lemadane/jax.git'
                    url = 'https://github.com/lemadane/jax'
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/" + (System.getenv("GITHUB_REPOSITORY") ?: "lemadane/jax"))
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user")
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key")
            }
        }
    }
}

// Optional library comparison: dependencies never enter the published JAX artifact.
sourceSets {
    comparison {
        java.srcDirs = ['src/comparison/java', 'examples/complex-organization/pojo', 'examples/supply-chain/pojo']
        resources.srcDir 'src/test/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    comparisonTest {
        compileClasspath += sourceSets.main.output + sourceSets.comparison.output
        runtimeClasspath += sourceSets.main.output + sourceSets.comparison.output
    }
}

configurations {
    comparisonTestImplementation.extendsFrom comparisonImplementation, testImplementation
    comparisonTestRuntimeOnly.extendsFrom comparisonRuntimeOnly, testRuntimeOnly
}

dependencies {
    comparisonImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    comparisonImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.1'
    comparisonImplementation 'com.google.code.gson:gson:2.13.2'
    comparisonImplementation 'org.openjdk.jmh:jmh-core:1.36'
    comparisonAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.36'
}

tasks.register('comparisonTest', Test) {
    description = 'Verify JAX, Jackson and Gson against the complete JSON/XML fixtures.'
    group = 'verification'
    testClassesDirs = sourceSets.comparisonTest.output.classesDirs
    classpath = sourceSets.comparisonTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('comparisonTest')
}

tasks.named('checkstyleComparison') {
    source = fileTree('src/comparison/java')
}

tasks.register('compareLibraries', JavaExec) {
    description = 'Run the separate JMH comparison after validating round-trip correctness.'
    group = 'verification'
    dependsOn tasks.named('comparisonTest')
    classpath = sourceSets.comparison.runtimeClasspath
    mainClass = 'com.lemadane.jax.comparison.ComparisonRunner'
    args layout.buildDirectory.dir('results/library-comparison').get().asFile.absolutePath
}
